name: Collect charts and publish Pages
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Refresh all public song histories (slower)
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    # UTC; hourly collection, with Sunday 00:01 KST reserved for backfill.
    - cron: '1 0-14,16-23 * * *'
    - cron: '1 15 * * 0-5'
    - cron: '1 15 * * 6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rescene-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect available public records
        env:
          BACKFILL: ${{ inputs.backfill }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$BACKFILL" = 'true' ] || [ "$SCHEDULE" = '1 15 * * 6' ]; then
            python scripts/scheduled_collect.py --backfill
          else
            python scripts/scheduled_collect.py
          fi
      - run: python -m unittest discover -s tests && python scripts/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test
      - name: Retain chart observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update RESCENE public chart records'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir public
          cp index.html public/index.html
          cp -R pulse-fit public/pulse-fit
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous PULSE FIT access
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          from pathlib import Path

          base = 'https://woniwoniwoniwoni.github.io/rescene-record/pulse-fit/'
          revision = os.environ['GITHUB_SHA']
          for name in ('', 'index.html', 'styles.css', 'engine.js', 'app.js'):
              expected = (Path('pulse-fit') / (name or 'index.html')).read_bytes()
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(
                          base + name + '?revision=' + revision,
                          headers={'User-Agent': 'PULSE-FIT-public-verification'}
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          assert response.status == 200
                          body = response.read()
                      assert body == expected, 'Public content differs from the committed file'
                      print('Anonymous HTTP 200, content verified:', name, len(body), 'bytes')
                      break
                  except Exception:
                      if attempt == 11:
                          raise
                      time.sleep(5)
          print('Public website verified:', base)
          PY
